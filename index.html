<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thredl — NWA Closet Swap</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --card: #22222f;
      --accent: #a78bfa;
      --accent2: #818cf8;
      --yes: #34d399;
      --no: #f87171;
      --text: #f1f0ff;
      --muted: #6b7280;
      --border: rgba(255,255,255,0.07);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    /* Header */
    header {
      width: 100%;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15,15,19,0.85);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .logo-sub {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: -2px;
      -webkit-text-fill-color: var(--muted);
    }

    .header-right {
      width: 36px; height: 36px;
      background: var(--surface);
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; cursor: pointer;
    }

    /* Main container */
    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* Upload panel */
    .panel {
      width: 100%;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      border: 1px solid var(--border);
    }

    .panel-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .upload-area {
      border: 1.5px dashed rgba(167,139,250,0.3);
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
      background: rgba(167,139,250,0.03);
    }

    .upload-area:hover {
      border-color: var(--accent);
      background: rgba(167,139,250,0.06);
    }

    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }

    .upload-icon { font-size: 2rem; margin-bottom: 8px; }

    .upload-area p {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .upload-area p span {
      color: var(--accent);
      font-weight: 600;
    }

    .upload-preview {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
      margin-top: 12px;
    }

    .fields {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .fields select, .fields input {
      flex: 1;
      padding: 11px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .select-wrap {
      position: relative; flex: 1;
    }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 0.8rem;
    }

    .fields select:focus, .fields input:focus {
      border-color: var(--accent);
    }

    .fields select option { background: #1a1a24; }

    .publish-btn {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .publish-btn:hover { opacity: 0.92; }
    .publish-btn:active { transform: scale(0.98); }

    /* Card stack */
    .stack-label {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stack-label span {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .stack-count {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
    }

    .card-stack {
      width: 100%;
      position: relative;
      height: 440px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transition: transform 0.45s cubic-bezier(.22,.68,0,1.2), opacity 0.35s ease;
      cursor: grab;
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .card-gradient {
      position: absolute;
      top: 160px;
      left: 0; right: 0;
      height: 130px;
      background: linear-gradient(to bottom, transparent, var(--card));
      pointer-events: none;
    }

    .card-info {
      padding: 16px 18px;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .card-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Stamps */
    .stamp {
      position: absolute;
      top: 24px;
      font-size: 1.2rem;
      font-weight: 800;
      border: 3px solid;
      border-radius: 8px;
      padding: 5px 14px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .stamp-yes { left: 18px; color: var(--yes); border-color: var(--yes); transform: rotate(-12deg); }
    .stamp-no  { right: 18px; color: var(--no);  border-color: var(--no);  transform: rotate(12deg); }

    .card.fly-left  { transform: translateX(-130%) rotate(-18deg) !important; opacity: 0; }
    .card.fly-right { transform: translateX(130%)  rotate(18deg)  !important; opacity: 0; }

    /* Actions */
    .actions {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .btn-action {
      width: 68px; height: 68px;
      border-radius: 50%;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .btn-action::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn-no  {
      background: rgba(248,113,113,0.12);
      border: 1.5px solid rgba(248,113,113,0.3);
      color: var(--no);
      box-shadow: 0 0 0 0 rgba(248,113,113,0);
    }

    .btn-yes {
      background: rgba(52,211,153,0.12);
      border: 1.5px solid rgba(52,211,153,0.3);
      color: var(--yes);
      width: 76px; height: 76px;
      font-size: 1.8rem;
    }

    .btn-no:hover  { transform: scale(1.1); box-shadow: 0 0 24px rgba(248,113,113,0.25); }
    .btn-yes:hover { transform: scale(1.1); box-shadow: 0 0 24px rgba(52,211,153,0.25); }
    .btn-action:active { transform: scale(0.94); }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      padding: 30px;
    }

    .empty-state .e-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; line-height: 1.6; }
    .empty-state strong { color: var(--accent); }

    /* Match modal */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      padding: 28px 24px 36px;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.35s cubic-bezier(.22,.68,0,1.1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
      margin: 0 auto 20px;
    }

    .match-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px;
    }

    .match-avatars {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--surface);
    }

    .avatar:last-child { margin-left: -16px; }

    .match-text h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .match-text p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .match-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(167,139,250,0.15), rgba(129,140,248,0.15));
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 18px;
    }

    .msg-area {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 4px 4px 4px 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .msg-area textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      resize: none;
      outline: none;
      padding: 10px 0;
      min-height: 44px;
      max-height: 100px;
    }

    .msg-area textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-bottom: 2px;
      transition: opacity 0.2s;
    }

    .send-btn:hover { opacity: 0.88; }

    .modal-dismiss {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .modal-dismiss:hover { border-color: var(--accent); color: var(--accent); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 300;
      transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Thredl</div>
    <div class="logo-sub">NWA Closet Swap</div>
  </div>
  <div class="header-right">👤</div>
</header>

<div class="container">

  <!-- Your listing -->
  <div class="panel">
    <div class="panel-label">Your Listing</div>

    <div class="upload-area" id="uploadArea">
      <input type="file" accept="image/*" id="fileInput" />
      <div class="upload-icon">📸</div>
      <p><span>Tap to upload</span> a photo of your item</p>
    </div>
    <img id="uploadPreview" class="upload-preview" alt="preview" />

    <div class="fields">
      <div class="select-wrap">
        <select id="location">
          <option value="">📍 City</option>
          <option>Bentonville</option>
          <option>Rogers</option>
          <option>Fayetteville</option>
          <option>Springdale</option>
          <option>Bella Vista</option>
          <option>Centerton</option>
          <option>Siloam Springs</option>
          <option>Cave Springs</option>
          <option>Lowell</option>
          <option>Johnson</option>
          <option>Elm Springs</option>
          <option>Highfill</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="size">
          <option value="">Size</option>
          <optgroup label="Clothing">
            <option>XS</option><option>S</option><option>M</option>
            <option>L</option><option>XL</option><option>XXL</option>
          </optgroup>
          <optgroup label="Shoes">
            <option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option><option>11</option><option>12</option>
          </optgroup>
        </select>
      </div>
    </div>

    <button class="publish-btn" onclick="publishListing()">Start Swapping →</button>
  </div>

  <!-- Stack header -->
  <div class="stack-label">
    <span>Browse Swaps</span>
    <div class="stack-count" id="countBadge">— items</div>
  </div>

  <!-- Card stack -->
  <div class="card-stack" id="cardStack">
    <div class="empty-state">
      <div class="e-icon">👗</div>
      <p>Fill out your listing above<br/>to start browsing local swaps in <strong>NWA</strong></p>
    </div>
  </div>

  <!-- Swipe buttons -->
  <div class="actions">
    <button class="btn-action btn-no"  onclick="swipe('no')"  title="Pass">✕</button>
    <button class="btn-action btn-yes" onclick="swipe('yes')" title="Swap">✓</button>
  </div>

</div>

<!-- Match / message modal -->
<div class="overlay" id="matchOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="match-header">
      <div class="match-avatars">
        <img class="avatar" id="matchAvatar" src="" alt="match" />
        <img class="avatar" src="https://api.dicebear.com/7.x/thumbs/svg?seed=you&backgroundColor=a78bfa" alt="you" />
      </div>
      <div class="match-text">
        <h2>It's a Match! 🎉</h2>
        <p id="matchName">They want your swap too</p>
      </div>
    </div>
    <div class="match-badge">✦ Mutual swap interest in NWA</div>

    <div class="msg-area">
      <textarea id="msgBox" placeholder="Hey! I love your piece — want to meet up in Bentonville to swap?" rows="2"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
    <button class="modal-dismiss" onclick="closeModal()">Maybe later</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const NWA_CITIES = [
    'Bentonville','Rogers','Fayetteville','Springdale',
    'Bella Vista','Centerton','Siloam Springs','Cave Springs',
    'Lowell','Johnson','Elm Springs','Highfill'
  ];

  const cards = [
    {
      name: "Vintage Levi's Denim Jacket",
      size: "M",
      city: "Bentonville",
      img: "https://images.unsplash.com/photo-1601933513793-537c8c0a1e7e?w=500&q=80",
      user: "Jordan K.",
      avatar: "https://api.dicebear.com/7.x/thumbs/svg?seed=jordan&backgroundColor=818cf8"
    },
    {
      name: "Floral Midi Dress",
      size: "S",
      city: "Fayetteville",
      img: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500&q=80",
      user: "Mia T.",
      avatar: "https://api.dicebear.com/7.x/thumbs/svg?seed=mia&backgroundColor=f9a8d4"
    },
    {
      name: "Air Force 1 Sneakers",
      size: "10",
      city: "Rogers",
      img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80",
      user: "Sam R.",
      avatar: "https://api.dicebear.com/7.x/thumbs/svg?seed=sam&backgroundColor=6ee7b7"
    },
    {
      name: "Linen Blazer",
      size: "L",
      city: "Springdale",
      img: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=500&q=80",
      user: "Alex W.",
      avatar: "https://api.dicebear.com/7.x/thumbs/svg?seed=alex&backgroundColor=fcd34d"
    },
    {
      name: "Boho Maxi Skirt",
      size: "XS",
      city: "Bella Vista",
      img: "https://images.unsplash.com/photo-1583496661160-fb5218e5a677?w=500&q=80",
      user: "Priya L.",
      avatar: "https://api.dicebear.com/7.x/thumbs/svg?seed=priya&backgroundColor=c4b5fd"
    },
  ];

  let idx = 0;
  let active = false;

  function publishListing() {
    const loc  = document.getElementById('location').value;
    const size = document.getElementById('size').value;
    if (!loc)  { showToast('Please select your city'); return; }
    if (!size) { showToast('Please select your size'); return; }
    active = true;
    idx = 0;
    updateCount();
    renderStack();
  }

  function updateCount() {
    const rem = Math.max(0, cards.length - idx);
    document.getElementById('countBadge').textContent = rem + ' item' + (rem !== 1 ? 's' : '');
  }

  function renderStack() {
    const stack = document.getElementById('cardStack');
    stack.innerHTML = '';

    if (idx >= cards.length) {
      stack.innerHTML = `<div class="empty-state">
        <div class="e-icon">🌟</div>
        <p>You've seen all NWA swaps!<br/>Check back soon for new listings.</p>
      </div>`;
      return;
    }

    const visible = cards.slice(idx, idx + 3).reverse();
    visible.forEach((c, i) => {
      const isTop = i === visible.length - 1;
      const depth = visible.length - 1 - i;
      const el = document.createElement('div');
      el.className = 'card';
      el.style.transform = `scale(${1 - depth * 0.04}) translateY(${depth * -12}px)`;
      el.style.zIndex = i;
      el.innerHTML = `
        <div class="stamp stamp-yes">SWAP ✓</div>
        <div class="stamp stamp-no">PASS ✕</div>
        <img src="${c.img}" alt="${c.name}" />
        <div class="card-gradient"></div>
        <div class="card-info">
          <div class="card-name">${c.name}</div>
          <div class="card-meta">
            <span class="pill">📍 ${c.city}</span>
            <span class="pill">Size ${c.size}</span>
            <span class="pill">👤 ${c.user}</span>
          </div>
        </div>`;
      stack.appendChild(el);
    });
  }

  function swipe(dir) {
    if (!active) { showToast('List your item first!'); return; }
    if (idx >= cards.length) return;

    const stack = document.getElementById('cardStack');
    const top = stack.querySelector('.card:last-child');
    if (!top) return;

    const stamp = top.querySelector(dir === 'yes' ? '.stamp-yes' : '.stamp-no');
    stamp.style.opacity = '1';

    setTimeout(() => {
      top.classList.add(dir === 'yes' ? 'fly-right' : 'fly-left');
      setTimeout(() => {
        const matched = cards[idx];
        idx++;
        updateCount();
        if (dir === 'yes') {
          openMatch(matched);
        } else {
          renderStack();
        }
      }, 380);
    }, 120);
  }

  function openMatch(card) {
    document.getElementById('matchAvatar').src = card.avatar;
    document.getElementById('matchName').textContent = card.user + ' wants to swap too!';
    document.getElementById('matchOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('matchOverlay').classList.remove('active');
    renderStack();
  }

  function sendMessage() {
    const msg = document.getElementById('msgBox').value.trim();
    if (!msg) { showToast('Write a message first!'); return; }
    closeModal();
    showToast('Message sent to ' + document.getElementById('matchName').textContent.split(' wants')[0] + ' 🎉');
    document.getElementById('msgBox').value = '';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // Upload preview
  document.getElementById('fileInput').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const p = document.getElementById('uploadPreview');
      p.src = e.target.result;
      p.style.display = 'block';
      document.querySelector('.upload-area p').innerHTML = '<span>Photo added ✓</span> Tap to change';
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
