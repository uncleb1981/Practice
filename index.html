<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vestaire — NWA Closet Barter</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #faf7f4;
      --surface: #ffffff;
      --card:    #ffffff;
      --accent:  #9b6b7b;
      --gold:    #c4a882;
      --yes:     #6b9e7f;
      --no:      #b85c4a;
      --text:    #2d2420;
      --muted:   #9e8c86;
      --light:   #f0ebe6;
      --border:  rgba(45,36,32,0.1);
      --radius:  18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 48px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .logo-tagline {
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .profile-dot {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--light);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    /* ── Container ── */
    .container {
      width: 100%;
      max-width: 400px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ── Listing panel ── */
    .panel {
      width: 100%;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(45,36,32,0.06);
    }

    .panel-label {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
    }

    .upload-area {
      border: 1.5px dashed rgba(155,107,123,0.35);
      border-radius: 12px;
      padding: 26px 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
      background: rgba(155,107,123,0.03);
    }

    .upload-area:hover {
      border-color: var(--accent);
      background: rgba(155,107,123,0.06);
    }

    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }

    .upload-icon { font-size: 1.8rem; margin-bottom: 8px; }

    .upload-area p {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .upload-area p strong { color: var(--accent); font-weight: 600; }

    .upload-preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 10px;
      display: none;
      margin-top: 12px;
    }

    .fields {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .select-wrap { position: relative; flex: 1; }

    .select-wrap::after {
      content: '›';
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%) rotate(90deg);
      color: var(--muted);
      pointer-events: none;
      font-size: 1rem;
    }

    .fields select {
      width: 100%;
      padding: 11px 30px 11px 12px;
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .fields select:focus { border-color: var(--accent); }

    .publish-btn {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.1s;
    }

    .publish-btn:hover { background: #885f6d; }
    .publish-btn:active { transform: scale(0.98); }

    /* ── Stack header ── */
    .stack-header {
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .stack-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--text);
    }

    .stack-count {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* ── Card stack ── */
    .card-stack {
      width: 100%;
      position: relative;
      height: 450px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(45,36,32,0.12);
      transition: transform 0.45s cubic-bezier(.22,.68,0,1.2), opacity 0.35s ease;
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      background: var(--light);
    }

    .card-gradient {
      position: absolute;
      top: 190px; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to bottom, transparent, var(--card));
      pointer-events: none;
    }

    .card-info { padding: 14px 18px 16px; }

    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .card-meta {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      background: var(--light);
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px 3px 3px;
    }

    .user-initial {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .user-pill span { font-size: 0.73rem; color: var(--muted); font-weight: 500; }

    /* ── Stamps ── */
    .stamp {
      position: absolute;
      top: 22px;
      font-size: 1rem;
      font-weight: 700;
      border: 2.5px solid;
      border-radius: 6px;
      padding: 5px 13px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }

    .stamp-yes { left: 16px; color: var(--yes); border-color: var(--yes); transform: rotate(-10deg); }
    .stamp-no  { right: 16px; color: var(--no);  border-color: var(--no);  transform: rotate(10deg); }

    .card.fly-left  { transform: translateX(-130%) rotate(-16deg) !important; opacity: 0; }
    .card.fly-right { transform: translateX(130%)  rotate(16deg)  !important; opacity: 0; }

    /* ── Action buttons ── */
    .actions {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .btn-action {
      border: none;
      cursor: pointer;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.2s;
      font-weight: 700;
    }

    .btn-no {
      width: 60px; height: 60px;
      background: #fff;
      border: 1.5px solid rgba(184,92,74,0.3);
      color: var(--no);
      font-size: 1.3rem;
      box-shadow: 0 2px 12px rgba(184,92,74,0.12);
    }

    .btn-yes {
      width: 70px; height: 70px;
      background: var(--accent);
      color: #fff;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px rgba(155,107,123,0.35);
    }

    .btn-no:hover  { transform: scale(1.08); box-shadow: 0 4px 18px rgba(184,92,74,0.22); }
    .btn-yes:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(155,107,123,0.45); }
    .btn-action:active { transform: scale(0.94); }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 30px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .empty-state .e-icon { font-size: 2.5rem; margin-bottom: 14px; }
    .empty-state p { font-size: 0.88rem; color: var(--muted); line-height: 1.7; }
    .empty-state strong { color: var(--accent); }

    /* ── Match modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(45,36,32,0.55);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 26px 26px 0 0;
      border-top: 1px solid var(--border);
      padding: 24px 22px 40px;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.38s cubic-bezier(.22,.68,0,1.1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-handle {
      width: 36px; height: 3px;
      background: var(--border);
      border-radius: 4px;
      margin: 0 auto 22px;
    }

    .match-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .monogram-pair {
      display: flex;
      align-items: center;
    }

    .monogram {
      width: 46px; height: 46px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      border: 2px solid var(--surface);
      flex-shrink: 0;
    }

    .monogram:last-child { margin-left: -14px; background: var(--gold); }

    .match-copy h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--text);
    }

    .match-copy p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .match-tag {
      display: inline-block;
      background: rgba(155,107,123,0.1);
      border: 1px solid rgba(155,107,123,0.2);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
      letter-spacing: 0.4px;
    }

    .msg-area {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px 4px 4px 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .msg-area textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      resize: none;
      outline: none;
      padding: 10px 0;
      min-height: 44px;
      max-height: 100px;
    }

    .msg-area textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-bottom: 2px;
      transition: background 0.2s;
    }

    .send-btn:hover { background: #885f6d; }

    .modal-dismiss {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .modal-dismiss:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      padding: 11px 22px;
      border-radius: 40px;
      font-size: 0.83rem;
      font-weight: 500;
      z-index: 300;
      transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Vestaire</div>
    <div class="logo-tagline">NWA Closet Barter</div>
  </div>
  <div class="profile-dot">ME</div>
</header>

<div class="container">

  <!-- Listing panel -->
  <div class="panel">
    <div class="panel-label">List Your Item</div>

    <div class="upload-area" id="uploadArea">
      <input type="file" accept="image/*" id="fileInput" />
      <div class="upload-icon">🪡</div>
      <p><strong>Tap to add a photo</strong> of your item</p>
    </div>
    <img id="uploadPreview" class="upload-preview" alt="preview" />

    <div class="fields">
      <div class="select-wrap">
        <select id="location">
          <option value="">City</option>
          <option>Bentonville</option>
          <option>Rogers</option>
          <option>Fayetteville</option>
          <option>Springdale</option>
          <option>Bella Vista</option>
          <option>Centerton</option>
          <option>Siloam Springs</option>
          <option>Cave Springs</option>
          <option>Lowell</option>
          <option>Johnson</option>
          <option>Elm Springs</option>
          <option>Highfill</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="size">
          <option value="">Size</option>
          <optgroup label="Clothing">
            <option>XS</option><option>S</option><option>M</option>
            <option>L</option><option>XL</option><option>XXL</option>
          </optgroup>
          <optgroup label="Shoes">
            <option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option><option>11</option><option>12</option>
          </optgroup>
        </select>
      </div>
    </div>

    <button class="publish-btn" onclick="publishListing()">Start Browsing</button>
  </div>

  <!-- Stack header -->
  <div class="stack-header">
    <div class="stack-title">Nearby Swaps</div>
    <div class="stack-count" id="countBadge"></div>
  </div>

  <!-- Card stack -->
  <div class="card-stack" id="cardStack">
    <div class="empty-state">
      <div class="e-icon">🧥</div>
      <p>Add your listing above to browse<br/>items available to barter in <strong>NWA</strong></p>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button class="btn-action btn-no"  onclick="swipe('no')"  title="Pass">✕</button>
    <button class="btn-action btn-yes" onclick="swipe('yes')" title="Swap">✓</button>
  </div>

</div>

<!-- Match modal -->
<div class="overlay" id="matchOverlay">
  <div class="modal">
    <div class="modal-handle"></div>

    <div class="match-row">
      <div class="monogram-pair">
        <div class="monogram" id="matchMonogram" style="background:var(--accent);">?</div>
        <div class="monogram">Y</div>
      </div>
      <div class="match-copy">
        <h2>It's a Match</h2>
        <p id="matchName">She loves your piece too</p>
      </div>
    </div>

    <div class="match-tag">✦ Mutual barter interest · Northwest Arkansas</div>

    <div class="msg-area">
      <textarea id="msgBox" placeholder="Hi! I'd love to swap — are you available this week?" rows="2"></textarea>
      <button class="send-btn" onclick="sendMessage()">→</button>
    </div>
    <button class="modal-dismiss" onclick="closeModal()">Maybe another time</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

    { name: "Merino Wool Turtleneck",       size: "S",   city: "Bella Vista",    img: unsplash("1578932750294-f5075e85f44a"), user: "Faye C."    },
  ];

  let idx = 0, active = false;

  const accentColors = ['#9b6b7b','#c4a882','#7a8fa6','#8a9e80','#b07d6e','#9688a8'];

  function initials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  function userColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return accentColors[Math.abs(h) % accentColors.length];
  }

  function publishListing() {
    const loc  = document.getElementById('location').value;
    const size = document.getElementById('size').value;
    if (!loc)  { showToast('Please select your city'); return; }
    if (!size) { showToast('Please select your size'); return; }
    active = true; idx = 0;
    updateCount();
    renderStack();
  }

  function updateCount() {
    const rem = Math.max(0, cards.length - idx);
    document.getElementById('countBadge').textContent = rem + ' available';
  }

  function renderStack() {
    const stack = document.getElementById('cardStack');
    stack.innerHTML = '';

    if (idx >= cards.length) {
      stack.innerHTML = `<div class="empty-state">
        <div class="e-icon">✨</div>
        <p>You've seen everything nearby.<br/>Check back soon for new listings.</p>
      </div>`;
      return;
    }

    cards.slice(idx, idx + 3).reverse().forEach((c, i, arr) => {
      const depth = arr.length - 1 - i;
      const el = document.createElement('div');
      el.className = 'card';
      el.style.transform = `scale(${1 - depth * 0.035}) translateY(${depth * -10}px)`;
      el.style.zIndex = i;
      el.innerHTML = `
        <div class="stamp stamp-yes">Swap</div>
        <div class="stamp stamp-no">Pass</div>
        <img src="${c.img}" alt="${c.name}"
             onerror="this.style.minHeight='300px';this.style.background='#f0ebe6';this.removeAttribute('src');" />
        <div class="card-gradient"></div>
        <div class="card-info">
          <div class="card-name">${c.name}</div>
          <div class="card-meta">
            <span class="pill">📍 ${c.city}</span>
            <span class="pill">Size ${c.size}</span>
            <span class="user-pill">
              <span class="user-initial" style="background:${userColor(c.user)}">${initials(c.user)}</span>
              <span>${c.user}</span>
            </span>
          </div>
        </div>`;
      stack.appendChild(el);
    });
  }

  function swipe(dir) {
    if (!active) { showToast('Add your listing first'); return; }
    if (idx >= cards.length) return;

    const top = document.querySelector('#cardStack .card:last-child');
    if (!top) return;

    top.querySelector(dir === 'yes' ? '.stamp-yes' : '.stamp-no').style.opacity = '1';

    setTimeout(() => {
      top.classList.add(dir === 'yes' ? 'fly-right' : 'fly-left');
      setTimeout(() => {
        const matched = cards[idx++];
        updateCount();
        if (dir === 'yes') openMatch(matched);
        else renderStack();
      }, 380);
    }, 120);
  }

  function openMatch(card) {
    const mono = document.getElementById('matchMonogram');
    mono.textContent = initials(card.user);
    mono.style.background = userColor(card.user);
    document.getElementById('matchName').textContent = card.user + ' is interested in swapping';
    document.getElementById('matchOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('matchOverlay').classList.remove('active');
    renderStack();
  }

  function sendMessage() {
    const msg = document.getElementById('msgBox').value.trim();
    if (!msg) { showToast('Write a message first'); return; }
    const name = document.getElementById('matchName').textContent.split(' is')[0];
    closeModal();
    showToast('Message sent to ' + name);
    document.getElementById('msgBox').value = '';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  document.getElementById('fileInput').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const p = document.getElementById('uploadPreview');
      p.src = e.target.result;
      p.style.display = 'block';
      document.querySelector('.upload-area p').innerHTML = '<strong>Photo added ✓</strong> — tap to change';
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
