<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClosetSwap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f0eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 16px 24px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header h1 {
      font-size: 1.6rem;
      color: #c0392b;
      letter-spacing: 1px;
    }

    header h1 span { color: #2c3e50; }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Upload panel */
    .upload-panel {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .upload-panel h2 {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .upload-area {
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
    }

    .upload-area:hover { border-color: #c0392b; }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-area .icon { font-size: 2rem; margin-bottom: 8px; }
    .upload-area p { color: #999; font-size: 0.85rem; }

    .upload-preview {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 10px;
      display: none;
      margin-top: 10px;
    }

    .fields {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .fields input, .fields select {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .fields input:focus, .fields select:focus { border-color: #c0392b; }

    .publish-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .publish-btn:hover { background: #a93226; }

    /* Card stack */
    .card-stack {
      width: 100%;
      position: relative;
      height: 420px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      transition: transform 0.3s ease, opacity 0.3s ease;
      user-select: none;
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .card-info {
      padding: 14px 16px;
    }

    .card-info h3 { font-size: 1.1rem; color: #2c3e50; }
    .card-info .meta {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .badge {
      background: #f5f0eb;
      color: #666;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .card.fly-left {
      transform: translateX(-150%) rotate(-20deg);
      opacity: 0;
    }

    .card.fly-right {
      transform: translateX(150%) rotate(20deg);
      opacity: 0;
    }

    .card-stamp {
      position: absolute;
      top: 20px;
      font-size: 2.5rem;
      font-weight: 900;
      border: 4px solid;
      border-radius: 8px;
      padding: 4px 14px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .stamp-yes { left: 20px; color: #27ae60; border-color: #27ae60; transform: rotate(-15deg); }
    .stamp-no  { right: 20px; color: #c0392b; border-color: #c0392b; transform: rotate(15deg); }

    /* Action buttons */
    .actions {
      display: flex;
      gap: 30px;
      justify-content: center;
    }

    .btn-action {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover { transform: scale(1.1); box-shadow: 0 6px 18px rgba(0,0,0,0.2); }

    .btn-no  { background: #fff; color: #c0392b; }
    .btn-yes { background: #fff; color: #27ae60; }

    /* Match modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .modal .match-icon { font-size: 3rem; }
    .modal h2 { margin: 10px 0 4px; color: #2c3e50; }
    .modal p  { color: #888; font-size: 0.9rem; margin-bottom: 16px; }

    .modal textarea {
      width: 100%;
      height: 90px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }

    .modal textarea:focus { border-color: #c0392b; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .modal-actions button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-send  { background: #c0392b; color: #fff; }
    .btn-close { background: #f0f0f0; color: #555; }

    .empty-state {
      text-align: center;
      color: #aaa;
      padding: 60px 20px;
    }

    .empty-state .icon { font-size: 3rem; }
    .empty-state p { margin-top: 10px; font-size: 0.95rem; }
  </style>
</head>
<body>

<header>
  <h1>Closet<span>Swap</span></h1>
</header>

<div class="container">

  <!-- Upload your item -->
  <div class="upload-panel">
    <h2>Your Listing</h2>
    <div class="upload-area" id="uploadArea">
      <input type="file" accept="image/*" id="fileInput" />
      <div class="icon">📷</div>
      <p>Tap to upload a photo of your item</p>
    </div>
    <img id="uploadPreview" class="upload-preview" alt="preview" />
    <div class="fields">
      <input type="text" id="location" placeholder="📍 City" />
      <select id="size">
        <option value="">Size</option>
        <option>XS</option><option>S</option><option>M</option>
        <option>L</option><option>XL</option><option>XXL</option>
        <option>6</option><option>7</option><option>8</option>
        <option>9</option><option>10</option><option>11</option><option>12</option>
      </select>
    </div>
    <button class="publish-btn" onclick="publishListing()">List My Item ✓</button>
  </div>

  <!-- Swipe cards -->
  <div class="card-stack" id="cardStack">
    <div class="empty-state">
      <div class="icon">👕</div>
      <p>List your item to start browsing swaps!</p>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button class="btn-action btn-no"  onclick="swipe('no')" title="Pass">✕</button>
    <button class="btn-action btn-yes" onclick="swipe('yes')" title="Like">✓</button>
  </div>

</div>

<!-- Match modal -->
<div class="modal-overlay" id="matchModal">
  <div class="modal">
    <div class="match-icon">🎉</div>
    <h2>It's a Match!</h2>
    <p>You both want to swap. Send them a message to get started!</p>
    <textarea id="msgBox" placeholder="Hey! I love your item, want to swap?"></textarea>
    <div class="modal-actions">
      <button class="btn-close" onclick="closeModal()">Maybe Later</button>
      <button class="btn-send"  onclick="sendMessage()">Send Message</button>
    </div>
  </div>
</div>

<script>
  // Sample cards to browse
  const sampleCards = [
    { name: "Vintage Denim Jacket",  size: "M",  location: "Austin, TX",    img: "https://images.unsplash.com/photo-1601933513793-537c8c0a1e7e?w=400&q=80" },
    { name: "Floral Summer Dress",   size: "S",  location: "Miami, FL",     img: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400&q=80" },
    { name: "Classic White Sneakers",size: "10", location: "Chicago, IL",   img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80" },
    { name: "Wool Blazer",           size: "L",  location: "New York, NY",  img: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=400&q=80" },
    { name: "Boho Maxi Skirt",       size: "XS", location: "Portland, OR",  img: "https://images.unsplash.com/photo-1583496661160-fb5218e5a677?w=400&q=80" },
  ];

  let cardIndex = 0;
  let published = false;

  function publishListing() {
    const loc  = document.getElementById('location').value.trim();
    const size = document.getElementById('size').value;
    const preview = document.getElementById('uploadPreview').src;

    if (!loc || !size) {
      alert('Please enter your city and size before listing.');
      return;
    }

    published = true;
    cardIndex  = 0;
    renderCards();
  }

  function renderCards() {
    const stack = document.getElementById('cardStack');
    stack.innerHTML = '';

    if (cardIndex >= sampleCards.length) {
      stack.innerHTML = '<div class="empty-state"><div class="icon">🌟</div><p>You\'ve seen all available swaps. Check back soon!</p></div>';
      return;
    }

    // Render up to 3 stacked cards (back to front)
    const visible = sampleCards.slice(cardIndex, cardIndex + 3).reverse();
    visible.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.transform = `scale(${1 - (visible.length - 1 - i) * 0.04}) translateY(${(visible.length - 1 - i) * -10}px)`;
      card.style.zIndex = i;
      card.innerHTML = `
        <div class="card-stamp stamp-yes">SWAP</div>
        <div class="card-stamp stamp-no">PASS</div>
        <img src="${c.img}" alt="${c.name}" />
        <div class="card-info">
          <h3>${c.name}</h3>
          <div class="meta">
            <span class="badge">📍 ${c.location}</span>
            <span class="badge">Size ${c.size}</span>
          </div>
        </div>`;
      stack.appendChild(card);
    });
  }

  function swipe(direction) {
    if (!published) { alert('List your item first!'); return; }
    if (cardIndex >= sampleCards.length) return;

    const stack = document.getElementById('cardStack');
    const topCard = stack.querySelector('.card:last-child');
    if (!topCard) return;

    // Show stamp
    const stamp = topCard.querySelector(direction === 'yes' ? '.stamp-yes' : '.stamp-no');
    stamp.style.opacity = '1';

    setTimeout(() => {
      topCard.classList.add(direction === 'yes' ? 'fly-right' : 'fly-left');

      setTimeout(() => {
        cardIndex++;

        if (direction === 'yes') {
          // ~50% chance of mutual match for demo
          const matched = Math.random() > 0.5;
          if (matched) {
            showMatch();
            return;
          }
        }

        renderCards();
      }, 350);
    }, 150);
  }

  function showMatch() {
    document.getElementById('matchModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('matchModal').classList.remove('active');
    renderCards();
  }

  function sendMessage() {
    const msg = document.getElementById('msgBox').value.trim();
    if (!msg) { alert('Write a message first!'); return; }
    alert('Message sent! Happy swapping 👗');
    document.getElementById('msgBox').value = '';
    closeModal();
  }

  // Image upload preview
  document.getElementById('fileInput').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const preview = document.getElementById('uploadPreview');
      preview.src = e.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });
</script>

</body>
</html>
